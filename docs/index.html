<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MCAF R10 MISRA Compliance Progress</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg:#eef3fb;
      --card:#ffffff;
      --ink:#1b2233;
      --muted:#5f6b85;
      --accent:#1f6feb;
      --accent-soft:rgba(31,111,235,0.15);
    }
    body {
      margin:0;
      font:16px/1.5 "IBM Plex Sans", "Work Sans", system-ui, sans-serif;
      background:
        radial-gradient(900px 260px at 80% -40px, rgba(31,111,235,0.18), transparent 60%),
        radial-gradient(700px 280px at 0% 0%, rgba(29,78,216,0.14), transparent 55%),
        var(--bg);
      color:var(--ink);
    }
    .wrap { max-width:980px; margin:32px auto; padding:16px; }
    .card {
      background:var(--card);
      border-radius:16px;
      padding:22px 24px 26px;
      box-shadow:0 16px 40px rgba(15,23,42,.12);
      border:1px solid rgba(31,111,235,.08);
    }
    .title { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:6px; }
    h1 { margin:0; font-size:20px; letter-spacing:.2px; }
    .subtle { margin:0 0 12px; color:var(--muted); font-size:13px; }
    canvas { width:100%; height:440px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title">
        <h1>MCAF R10 MISRA Compliance Progress</h1>
      </div>
      <p class="subtle">Violations remaining over time</p>
      <canvas id="chart"></canvas>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>
    async function loadCsv(url) {
      const text = await fetch(url, { cache: "no-store" }).then(r => r.text());
      const lines = text.trim().split("\n");
      const rows = lines.slice(1).filter(Boolean);
      return rows.map(r => {
        const [date, violations] = r.split(/[\t,]/);
        return { date, violations: Number(violations) };
      });
    }
    (async () => {
      const data = await loadCsv("./data.csv");
      const labels = data.map(d => d.date);
      const values = data.map(d => d.violations);
      const maxVal = values.length ? Math.max(...values) : 0;
      new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "Violations left",
            data: values,
            borderColor: "#1f6feb",
            backgroundColor: "rgba(31,111,235,0.16)",
            fill: true,
            tension: 0.25,
            pointRadius: 3,
            pointHoverRadius: 5,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              title: { display: true, text: "Date" },
              grid: { color: "rgba(30,41,59,0.08)" },
              ticks: { color: "#5f6b85" }
            },
            y: {
              title: { display: true, text: "Violations left" },
              grid: { color: "rgba(30,41,59,0.08)" },
              ticks: { color: "#5f6b85" },
              suggestedMin: 0,
              suggestedMax: Math.ceil(maxVal * 1.05)
            }
          },
          plugins: {
            legend: { labels: { color: "#3f4a63" } },
            tooltip: {
              backgroundColor: "rgba(17,24,39,0.9)",
              titleColor: "#f8fafc",
              bodyColor: "#e2e8f0",
              borderColor: "rgba(31,111,235,0.5)",
              borderWidth: 1
            }
          }
        }
      });
    })();
  </script>
</body>
</html>
