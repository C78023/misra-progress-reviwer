<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MCAF R10 MISRA Compliance Progress</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg:       #0f1623;
      --surface:  #161e2e;
      --card:     #1c2640;
      --border:   rgba(99,132,255,0.14);
      --ink:      #e8edf5;
      --muted:    #7e8da8;
      --accent:   #4f8ef7;
      --accent2:  #38bdf8;
      --green:    #34d399;
      --red:      #f87171;
    }

    html, body {
      margin: 0; padding: 0;
      height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 40% at 70% -10%, rgba(79,142,247,0.12), transparent 60%),
        radial-gradient(ellipse 60% 30% at 10% 80%,  rgba(56,189,248,0.08), transparent 55%);
    }

    .wrap {
      max-width: 1020px;
      margin: 0 auto;
      padding: 36px 20px 40px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .header-left h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .2px;
      color: var(--ink);
    }
    .header-left p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(52,211,153,0.12);
      color: var(--green);
      border: 1px solid rgba(52,211,153,0.22);
      white-space: nowrap;
    }
    .badge::before {
      content: '';
      display: block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    /* ── Stats row ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
    }
    .stat-value.good { color: var(--green); }
    .stat-value.bad  { color: var(--red);   }
    .stat-sub {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Chart card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px 22px;
    }
    .chart-box { width: 100%; }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <h1>MCAF R10 MISRA Compliance Progress</h1>
        <p>Tracking violations remaining over time</p>
      </div>
      <div class="badge" id="status-badge">Live</div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Current violations</div>
        <div class="stat-value" id="stat-current">—</div>
        <div class="stat-sub">latest recorded</div>
      </div>
      <div class="stat">
        <div class="stat-label">Resolved</div>
        <div class="stat-value good" id="stat-resolved">—</div>
        <div class="stat-sub">since start</div>
      </div>
      <div class="stat">
        <div class="stat-label">Last updated</div>
        <div class="stat-value" id="stat-date" style="font-size:18px">—</div>
        <div class="stat-sub">date of last entry</div>
      </div>
    </div>

    <!-- Chart -->
    <div class="card">
      <div class="chart-box">
        <canvas id="chart"></canvas>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>
    async function loadCsv(url) {
      const text = await fetch(url, { cache: "no-store" }).then(r => r.text());
      const lines = text.trim().split("\n");
      return lines.slice(1).filter(Boolean).map(r => {
        const [date, violations] = r.split(/[\t,]/);
        return { date: date.trim(), violations: Number(violations) };
      });
    }

    (async () => {
      const data = await loadCsv("./data.csv");
      const labels = data.map(d => d.date);
      const values = data.map(d => d.violations);
      const maxVal = values.length ? Math.max(...values) : 0;
      const minVal = values.length ? Math.min(...values) : 0;
      const first  = values[0]            ?? 0;
      const last   = values[values.length - 1] ?? 0;
      const resolved = first - last;

      // Fill stats
      document.getElementById("stat-current").textContent  = last.toLocaleString();
      document.getElementById("stat-resolved").textContent = (resolved >= 0 ? "+" : "") + resolved.toLocaleString();
      document.getElementById("stat-date").textContent     = labels[labels.length - 1] ?? "—";
      if (resolved < 0) {
        document.getElementById("stat-resolved").classList.replace("good", "bad");
      }

      // Gradient fill
      const ctx = document.getElementById("chart").getContext("2d");
      const grad = ctx.createLinearGradient(0, 0, 0, 400);
      grad.addColorStop(0,   "rgba(79,142,247,0.35)");
      grad.addColorStop(0.6, "rgba(79,142,247,0.08)");
      grad.addColorStop(1,   "rgba(79,142,247,0.00)");

      new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "Violations left",
            data: values,
            borderColor: "#4f8ef7",
            backgroundColor: grad,
            fill: true,
            tension: 0.35,
            pointRadius: 4,
            pointHoverRadius: 7,
            pointBackgroundColor: "#4f8ef7",
            pointBorderColor: "#1c2640",
            pointBorderWidth: 2,
            borderWidth: 2.5
          }]
        },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          scales: {
            x: {
              title: { display: true, text: "Date", color: "#7e8da8", font: { size: 12 } },
              grid:  { color: "rgba(255,255,255,0.04)" },
              ticks: { color: "#7e8da8", maxRotation: 45, font: { size: 11 } },
              border: { color: "rgba(255,255,255,0.06)" }
            },
            y: {
              title: { display: true, text: "Violations left", color: "#7e8da8", font: { size: 12 } },
              grid:  { color: "rgba(255,255,255,0.04)" },
              ticks: { color: "#7e8da8", font: { size: 11 } },
              border: { color: "rgba(255,255,255,0.06)" },
              suggestedMin: 0,
              suggestedMax: Math.ceil(maxVal * 1.08)
            }
          },
          plugins: {
            legend: {
              labels: {
                color: "#7e8da8",
                boxWidth: 12,
                font: { size: 12 }
              }
            },
            tooltip: {
              backgroundColor: "#0f1623",
              titleColor: "#e8edf5",
              bodyColor:  "#b0bcd4",
              borderColor: "rgba(79,142,247,0.4)",
              borderWidth: 1,
              padding: 10,
              callbacks: {
                label: ctx => ` ${ctx.parsed.y.toLocaleString()} violations`
              }
            }
          }
        }
      });
    })();
  </script>
</body>
</html>
