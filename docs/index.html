<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MISRA Compliance Progress</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#f5f7fb; --card:#ffffff; --ink:#1c2230; --accent:#1e6fe8; }
    body { margin:0; font:16px/1.4 "IBM Plex Sans", system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width:900px; margin:24px auto; padding:16px; }
    .card { background:var(--card); border-radius:12px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
    h1 { margin:0 0 12px; font-size:20px; }
    canvas { width:100%; height:420px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>MISRA Violations Remaining</h1>
      <canvas id="chart"></canvas>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>
    async function loadCsv(url) {
      const text = await fetch(url, { cache: "no-store" }).then(r => r.text());
      const lines = text.trim().split("\n");
      const rows = lines.slice(1).filter(Boolean);
      return rows.map(r => {
        const [date, violations] = r.split(/[\t,]/);
        return { date, violations: Number(violations) };
      });
    }
    (async () => {
      const data = await loadCsv("./data.csv");
      const labels = data.map(d => d.date);
      const values = data.map(d => d.violations);
      new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "Violations left",
            data: values,
            borderColor: "#1e6fe8",
            backgroundColor: "rgba(30,111,232,0.15)",
            fill: true,
            tension: 0.25,
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: { title: { display: true, text: "Date" } },
            y: { title: { display: true, text: "Violations left" }, beginAtZero: true }
          }
        }
      });
    })();
  </script>
</body>
</html>
